server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/markdown;

    # 通过 Docker 内置 DNS 按需解析，后端容器重建换了 IP 也能找到
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        # proxy_pass 使用变量且不带 URI，请求路径原样转发（保留 /api 前缀）
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：不缓冲、保持长连接。后端每 15 秒发一次 ping，读超时只需大于这个间隔
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 前端路由（/games/:id 等）都回退到 index.html；index.html 本身不缓存，保证发版后立即生效
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
